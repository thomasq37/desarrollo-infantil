<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Développement et vaccins</title>
<link rel="stylesheet" href="desarrollo.css">
</head>
<body>
<header>
  <div class="top">
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Langue / Idioma">
      <button data-l="fr" aria-pressed="true">FR</button>
      <button data-l="es" aria-pressed="false">ES</button>
    </div>
  </div>
  <div class="age-row">
    <label for="age" id="ageLabel"></label>
    <div class="stepper">
      <button class="step" id="minus" type="button">−</button>
      <input id="age" type="text" inputmode="decimal" autocomplete="off">
      <button class="step" id="plus" type="button">+</button>
    </div>
    <span class="unit" id="ageUnit"></span>
  </div>
</header>
<main>
  <div class="row tabs" id="tabs" role="group"></div>
  <div class="row views" role="group">
    <button class="chip" data-v="soon" id="vSoon"></button>
    <button class="chip" data-v="all" id="vAll"></button>
  </div>
  <details class="filters">
    <summary id="fsum"></summary>
    <input class="search" id="q" type="search" autocomplete="off">
    <div id="catBlock"><div class="lbl" id="l1"></div>
    <div class="row" id="cats"></div></div>
    <div class="lbl" id="l2"></div>
    <div class="row" id="ages"></div>
    <div id="stBlock"><div class="lbl" id="l3"></div>
    <div class="row" id="sts"></div></div>
    <button class="reset" id="reset" type="button" hidden></button>
  </details>
  <div class="need" id="needAge" hidden></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="list"></div>
  <div class="notes" id="notes" hidden></div>
</main>
<footer id="src"></footer>
<script src="desarrollo.js"></script>
</body>
</html>
